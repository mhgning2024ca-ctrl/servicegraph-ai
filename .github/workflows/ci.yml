name: ServiceGraph CI

on:
  push:
    branches:
      - main
      - integration
      - 'feature/**'
  pull_request:
    branches:
      - main
      - integration

permissions:
  contents: read

concurrency:
  group: servicegraph-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, typecheck, tests and quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Workspace tests
        run: pnpm test

      - name: Frozen contract checks
        run: node tests/quality/contracts.mjs

      - name: Runtime contract checks
        run: node tests/quality/implementation-contracts.mjs

      - name: Component quality suites
        run: node tests/quality/components.mjs

      - name: Frontend FR/EN, PWA and responsive smoke
        run: node tests/quality/ui-smoke.mjs

      - name: Secret scan
        run: node tests/quality/secrets.mjs

      - name: Infrastructure static validation
        run: bash infrastructure/tests/validate.sh

      - name: Start integrated API
        shell: bash
        run: |
          set -euo pipefail
          AUTH_MODE=mock API_HOST=127.0.0.1 API_PORT=3001 CORS_ALLOWED_ORIGINS=http://localhost:3000 \
            pnpm --filter @servicegraph/api start > /tmp/servicegraph-api.log 2>&1 &
          echo $! > /tmp/servicegraph-api.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3001/v1/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/servicegraph-api.log >&2
          exit 1

      - name: Running API smoke
        env:
          API_BASE_URL: http://127.0.0.1:3001
          INCIDENT_MANAGER_TOKEN: demo-incident-manager
        run: node tests/quality/api-smoke.mjs

      - name: Canonical running E2E
        env:
          API_BASE_URL: http://127.0.0.1:3001
          INCIDENT_MANAGER_TOKEN: demo-incident-manager
        run: node tests/quality/e2e.mjs

      - name: Stop integrated API
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/servicegraph-api.pid ]]; then
            kill "$(cat /tmp/servicegraph-api.pid)" 2>/dev/null || true
          fi
          if [[ -f /tmp/servicegraph-api.log ]]; then
            tail -n 200 /tmp/servicegraph-api.log
          fi
