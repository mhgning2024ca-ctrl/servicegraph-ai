name: ServiceGraph CI

on:
  push:
    branches:
      - main
      - integration
      - 'feature/**'
  pull_request:
    branches:
      - main
      - integration

permissions:
  contents: read

concurrency:
  group: servicegraph-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, typecheck, tests and quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Workspace tests
        run: pnpm test

      - name: Frozen contract checks
        run: node tests/quality/contracts.mjs

      - name: Runtime contract checks
        run: node tests/quality/implementation-contracts.mjs

      - name: Component quality suites
        run: node tests/quality/components.mjs

      - name: Frontend FR/EN, PWA and responsive smoke
        run: node tests/quality/ui-smoke.mjs

      - name: Secret scan
        run: node tests/quality/secrets.mjs
